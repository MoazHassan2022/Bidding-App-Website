name: 🚀 Deploy Prod Website via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: 🔐 Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 🚀 SSH and deploy
        run: |
          ssh root@${{ secrets.PROD_SERVER_IP }} << 'EOF'
            cd ${{ secrets.PROD_SERVER_PATH }}
            git checkout main
            git pull origin main
            docker compose --profile prod stop
            docker compose --profile prod rm -f
            docker compose --profile prod up --build -d
            docker image prune -f
          EOF